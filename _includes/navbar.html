<header class="site-header">
	<div class="nav-container">
		<a href="{{ '/' | relative_url }}" class="nav-brand">
			{% include collectoss-logo-black.svg %}
		</a>

		<button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
			<span class="hamburger-bar"></span>
			<span class="hamburger-bar"></span>
			<span class="hamburger-bar"></span>
		</button>

		<nav class="nav-menu" id="navMenu">
			<ul class="nav-list">
				<li>
					<a href="#features" class="nav-link">Features</a>
				</li>
				<li>
					<a href="https://docs.collectoss.org" class="nav-link" target="_blank" rel="noopener">Docs</a>
				</li>
				<li>
					<a href="https://github.com/collectoss" class="nav-link" target="_blank" rel="noopener">
						<i class="fab fa-github"></i> GitHub
					</a>
				</li>
			</ul>
		</nav>
	</div>
</header>

<script>
	document.addEventListener('DOMContentLoaded', function () {
		const navToggle = document.getElementById('navToggle');
		const navMenu = document.getElementById('navMenu');

		if (navToggle && navMenu) {
			navToggle.addEventListener('click', function () {
				navMenu.classList.toggle('is-open');
			});
		}
	});
</script>
