<nav class="nav-menu" id="navMenu">
	<ul class="{{ include.class | default: 'nav-list'}}">
		{% for item in include.items %}
		{% assign is_active = false %}
		{% if page.url == item.url or page.url contains item.url and item.url != '/' %}
		{% assign is_active = true %}
		{% endif %}


		<li>
			<a href="{{ item.url | relative_url }}" class="nav-link {% if is_active %}active{% endif %}" {% if item.external %}target="_blank" rel="noopener noreferrer" {% endif %}>
				{% if item.icon %}<i class=" {{ item.icon }}"></i>{% endif %} {{ item.name }}
			</a>
		</li>
		{% endfor %}
	</ul>
</nav>
