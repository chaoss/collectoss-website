- question: How do I pronounce CollectOSS? What is the story behind the new name?
  answer:
    - "The name CollectOSS (pronounced: collect us) was picked as a nod to the purpose of the project (collecting data on open source repositories) while being easy-to-remember. The OSS suffix is also intended to evoke a shared purpose with both CHAOSS and many other open source community projects whose names also end with OSS"

- question: Is this a new project?
  answer:
    - Yes and no.
    - CollectOSS is a new project name and governance structure, but is building on top of existing community metrics work that has been developed under CHAOSS <a href="https://github.com/chaoss/CollectOSS/commit/2517e04858fbd1f1478da8c985f3d3123d83322f">since 2018</a>.
    - While both projects originally started from the same Python codebase, the two are now separate, independent projects with different governance and set of maintainers behind each. We are grateful to <a href="https://github.com/chaoss/CollectOSS/blob/main/CREDITS.md">everyone</a> who helped contribute to this project - both before and after the split.
    - CollectOSS is not an AI rewrite, it is a continuation of the same development work that came before it with a renewed focus on open, community-first development practices.


- question: Why was there a fork?
  answer:
    - 'When a project representing a core function of the community suddenly moves, it can leave behind a vaccum. The impacts of such a change sends shockwaves through a community: Community data resources can be suddenly unavailable; contributors can feel destabilized and disengage from the project; additional incident response work causes delays and diverts maintainer time away from helping contributors who want to make a difference.'
    - Creating a hard fork was not an easy choice, but in the aftermath of an unprecedented disruption, it became a necessary step to return a sense of stability to the CHAOSS community. CollectOSS represents an opportunity to strengthen the pillars upon which we stand, shift our balance, and ultimately provide the community with a stable platform to continue the valuable metrics work that was already being undertaken within CHAOSS.
    - For more details, see <a href="https://www.chaoss.community/public-update-on-recent-events-at-chaoss/">this announcement</a> from the CHAOSS board.

- question: What is the mission of the CollectOSS project?
  answer:
    - CollectOSS focuses on collecting data from public git-based code hosting platforms ("forges") such as GitHub to help measure the social and community health of the human communities that are contributing to critical open source ecosystems.
    - The data CollectOSS collects covers more than just code contributions and extends to anything that can be derived from forge data, including comments, change reviews, releases, and other project activity.
    - For more information, see the <a href="https://docs.collectoss.org/en/release/about/scope.html">"Our Scope" page in the CollectOSS Documentation</a>

- question: How is CollectOSS governed?
  answer:
    -  'CollectOSS has introduced a governance process that is based on a template from the CNCF. This policy is available to anyone in the repository <a href="https://github.com/chaoss/CollectOSS/blob/main/GOVERNANCE.md">GOVERNANCE.md</a> and codifies proven community-oriented procedures and policies for key functions such as: maintainer addition, maintainer removal, voting, governance changes, and more. Feedback is always welcome and changes to this document are possible with a ⅔ vote of the maintainers.'


- question: How can I get started or help out?
  answer:
    - Anyone is welcome to utilize the <a href="https://docs.collectoss.org">official docs</a> and <a href="https://github.com/chaoss/CollectOSS/blob/main/README.md">README</a> to get started with using CollectOSS.
    - If you would like to join the community, we welcome you to join the <a href="https://chaoss.community/kb-getting-started/">CHAOSS Slack</a> in the <b style="white-space:nowrap;">#wg-collectoss-8knot</b> channel. This is where you can chat with other contributors and maintainers to get help or decide if this is the right community for you!
    - To make your first contributions, take a look at the <a href="https://github.com/chaoss/CollectOSS/blob/main/CONTRIBUTING.md">CONTRIBUTING</a> file to learn how to make your first contribution. We especially encourage you to check out any issues with labels like "good first issues", "help wanted", or "first timers only"
