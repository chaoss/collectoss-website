- icon: fas fa-people-carry-box
  title: Real Experience
  body: The deep experience of our passionate CollectOSS community helps us continue <a href="https://github.com/chaoss/CollectOSS/graphs/contributors?all=1">10 years</a> of industry-leading health metrics work without losing the human touch.

- icon: fas fa-hand-holding-heart
  title: Freely licensed
  body: CollectOSS is maintained under the <a href="https://github.com/chaoss/CollectOSS/blob/main/LICENSE">MIT license</a>. You won't find free samples or sign-up walls here because the best part of having a great recipe is sharing it.

- icon: fas fa-balance-scale
  title: Open Governance
  body: Our welcoming community is backed by open, transparent <a href="https://github.com/chaoss/CollectOSS/blob/main/GOVERNANCE.md">governance</a> which works with our <a href="https://github.com/chaoss/CollectOSS/blob/main/CONTRIBUTING.md">contribution guidelines</a> to give everyone a fair shot.

- icon: fab fa-docker
  title: Container-First
  body: Deploy CollectOSS on common infrastructure easily. We ship container images that can be run in either docker or podman and can be run from a single compose file.

- icon: fas fa-cubes
  title: A Pluggable Foundation
  body: CollectOSS is part of your stack, not your entire stack. You can combine analysis scripts and dashboard tools from the existing ecosystem or build something that fits your unique needs.

- icon: fas fa-handshake
  title: Vendor-Neutral
  body: Because CollectOSS is part of the Linux Foundation through <a href="https://chaoss.community">CHAOSS</a>, even corporate competitors are welcome, helping reduce single-vendor lock-in.
