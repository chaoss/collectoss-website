  <link rel="preload" href="{{site.baseurl}}/assets/data/8knot.json" as="fetch" type="application/json" crossorigin>

  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

      crossorigin="anonymous" referrerpolicy="no-referrer">

    // Check for DNT or GPC signals
    const dnt = navigator.doNotTrack === "1" || window.doNotTrack === "1";
    const gpc = navigator.globalPrivacyControl === true;

    let posthog_settings = {
      api_host: 'https://us.i.posthog.com',
      defaults: '2026-05-30',
      cookieless_mode: 'always',
    }
    if (dnt || gpc) {
      console.log("Privacy signal detected. PostHog tracking disabled.");
      // init plausible with opt_out flag to be safe
      posthog_settings.opt_out_capturing_by_default = true
    }
    posthog.init('{{ site.posthog.tracking_id }}', posthog_settings)

<body>
  {% include navbar.html items=site.data.navigation %}

  <main>
    {{ content }}
  </main>

  <footer id="footer" class="noPrint">
    <div class="container footer-content">
      <p class="footer-copy">
        Made with <i class="fas fa-heart text-red"></i> by the <strong>CollectOSS</strong> community.
      </p>
      {% include navitems.html items=site.data.footernav class="footer-links" %}
    </div>
  </footer>
</body>

</html>
